baseURL = 'https://ChenHua1j1n.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = "陈怀今 Chen Huaijin's blog"
theme = 'papermod'

# ============ 基础设置 ============
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true      # 中文自动断词、字数统计更准确
pagination.pagerSize = 10  # 每页文章数

# ============ 内容组织 ============
# 文章默认路径：/posts/<文件名>/（文件名用英文，URL 保持简洁）
# 如需固定模式，可给文章加 slug 字段后启用：
# [permalinks]
#   posts = '/posts/:slug/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

# ============ 输出格式（RSS + 搜索）============
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

# ============ 页面生成 ============
[markup]
  [markup.goldmark.renderer]
    unsafe = true            # 允许文章内写原始 HTML
  [markup.highlight]
    noClasses = false        # 代码块高亮使用 CSS class，便于换主题
    guessSyntax = true
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# ============ 站点参数 ============
[params]
  defaultTheme = 'auto'      # auto / light / dark
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true             # 文章页自动生成目录
  TocOpen = false
  comments = false           # 需要时接入评论区
  displayFullLangName = false

  # 首页简介
  [params.homeInfoParams]
    Title = '欢迎来到我的博客 👋'
    Content = '这里记录我的学习笔记与生活随笔。'

  [params.profileMode]
    enabled = false          # 改为 true 可切换为个人主页式首页

  # 社交图标（首页简介下方 + 其他位置）
  [[params.socialIcons]]
    name = 'github'
    title = 'GitHub'
    url = 'https://github.com/ChenHua1j1n'

  [[params.socialIcons]]
    name = 'email'
    title = 'Email'
    url = 'mailto:dongcheen@outlook.com'

  # 文章页面的编辑链接（可选，默认为空不显示）
  # [params.editPost]
  #   URL = 'https://github.com/<user>/<repo>/edit/main/content/'
  #   Text = '编辑此页'
  #   appendFilePath = true

  # 搜索（PaperMod 内置，配合 home 的 JSON 输出）
  [params.search]
    enable = true

# ============ 菜单 ============
[[menu.main]]
  identifier = 'home'
  name = '首页'
  url = '/'
  weight = 10

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 50

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 60

