name: Deploy Hugo site to GitHub Pages

on:
  # 推送到 main 分支时自动构建并发布
  push:
    branches: ["main"]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 需要写入 gh-pages 分支，同时用 GITHUB_TOKEN 完成认证
permissions:
  contents: write

# 同一时间只跑一个部署；新的推送可打断排队中的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: false

# 构建使用的 Hugo 版本（与本机 v0.168.0 一致，需 Extended）
env:
  HUGO_VERSION: "0.168.0"

defaults:
  run:
    shell: bash

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) 检出源码，并递归拉取主题 submodule
      - name: 检出源码（含主题 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2) 安装 Hugo Extended
      - name: 安装 Hugo Extended ${{ env.HUGO_VERSION }}
        run: |
          wget -q -O hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      # 3) 构建站点（baseURL 已写在 hugo.toml 中，指向根域名）
      - name: 构建站点
        run: hugo --gc --minify

      # 4) 发布 public/ 到 gh-pages 分支
      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # 保留自定义域名文件（若以后绑定自有域名）
          cname: ""
          # 提交信息
          commit_message: "Deploy Hugo site: ${{ github.event.head_commit.message }}"
