name: Deploy Hugo site to GitHub Pages

on:
  # 推送到 main 分支时自动构建部署
  push:
    branches: ["main"]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予所需权限（GITHUB_TOKEN）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；新的推送可打断排队中的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: false

# 构建时使用的 Hugo 版本（与本机 v0.168.0 保持一致，需 Extended 版）
env:
  HUGO_VERSION: "0.168.0"

defaults:
  run:
    shell: bash

jobs:
  # ---------- 1. 构建 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（含主题 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Hugo Extended ${{ env.HUGO_VERSION }}
        run: |
          wget -q -O hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建站点
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ---------- 2. 部署 ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
